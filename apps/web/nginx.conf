# Giống proxy của Vite khi dev (vite.config.ts): web và API cùng một địa chỉ để cookie đăng nhập dùng được.
server {
  listen 80;
  client_max_body_size 12m;

  location /api/user/       { proxy_pass http://user-service:3001; }
  location /api/market/     { proxy_pass http://marketplace-service:3002; }
  location /api/payment/    { proxy_pass http://payment-service:3003; }
  location /api/approval/   { proxy_pass http://approval-service:3004; }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Đường dẫn của React Router (/dang-nhap, /quan-tri/...) đều trả index.html
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
