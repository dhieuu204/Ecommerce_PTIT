name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Test của service chạy với PostgreSQL thật (mỗi service tự tạo database <tên>_test)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra định dạng
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Build (gồm sinh Prisma client)
        run: pnpm build
      - name: Kiểm tra kiểu
        run: pnpm typecheck
      - name: Tạo tài khoản database của các service
        run: psql -h localhost -U postgres -f infra/postgres/init/01-create-dbs.sql
        env:
          PGPASSWORD: postgres
      - name: Test
        run: pnpm test
