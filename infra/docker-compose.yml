# Hạ tầng chạy local khi code hằng ngày (Docker Compose). Các service NestJS và web chạy bằng `pnpm dev` trên máy.
# Bản Kubernetes (k3s) để chạy thử và demo nằm ở infra/k8s.
name: san-tmdt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres}']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-san}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-san}
    ports:
      - '5672:5672'
      - '15672:15672' # trang quản lý: http://localhost:15672

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - '9000:9000'
      - '9001:9001' # trang quản lý: http://localhost:9001
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP cho service gửi mail
      - '8025:8025' # hộp thư giả: http://localhost:8025

volumes:
  pgdata:
  miniodata:
